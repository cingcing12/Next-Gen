name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch name (e.g., master)
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your Node.js version
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Production
        # Inject the Vercel backend URL into the production build
        run: echo "VITE_API_URL=https://backend-theta-ten-15.vercel.app/api" > .env.production

      - name: Build project
        run: npm run build

      - name: Setup SPA Routing (404 Fallback)
        # GitHub Pages doesn't natively support SPA routing. 
        # This copies index.html to 404.html so refreshing subpages works.
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
